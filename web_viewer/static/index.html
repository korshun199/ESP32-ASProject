<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ESP32 Three Mic Point Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>ESP32 Three Mic Point Viewer</h1>
        <p>MIC1=D34 · MIC2=D35 · MIC3=VP/GPIO36 · AUDIO=D25</p>
      </div>
      <div id="status" class="status">waiting</div>
    </header>

    <section class="layout">
      <section class="panel">
        <h2>Координата источника</h2>
        <canvas id="radar" width="600" height="600"></canvas>
      </section>

      <section class="panel">
        <h2>Данные микрофонов</h2>

        <div class="coords">
          <div>X: <span id="xValue">0</span></div>
          <div>Y: <span id="yValue">0</span></div>
        </div>

        <h3>Частота</h3>
        <div class="meters">
          <div class="meter">
            <label>MIC1 <span id="freq1">0</span> Hz</label>
            <div><span id="freqBar1"></span></div>
          </div>
          <div class="meter">
            <label>MIC2 <span id="freq2">0</span> Hz</label>
            <div><span id="freqBar2"></span></div>
          </div>
          <div class="meter">
            <label>MIC3 <span id="freq3">0</span> Hz</label>
            <div><span id="freqBar3"></span></div>
          </div>
        </div>

        <h3>Громкость</h3>
        <div class="meters">
          <div class="meter">
            <label>MIC1 <span id="vol1">0</span></label>
            <div><span id="volBar1"></span></div>
          </div>
          <div class="meter">
            <label>MIC2 <span id="vol2">0</span></label>
            <div><span id="volBar2"></span></div>
          </div>
          <div class="meter">
            <label>MIC3 <span id="vol3">0</span></label>
            <div><span id="volBar3"></span></div>
          </div>
        </div>

        <h3>Последний кадр</h3>
        <pre id="raw">{}</pre>
      </section>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
