<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ESP32 Mobile Sound Point</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <h1>Sound Point</h1>
        <p>ESP32 · 3 MIC emulator</p>
      </div>
      <div id="status" class="status">waiting</div>
    </header>

    <section class="radar-card">
      <canvas id="radar" width="360" height="360"></canvas>
    </section>

    <section class="xy-card">
      <div>
        <span class="label">X</span>
        <strong id="xValue">0</strong>
      </div>
      <div>
        <span class="label">Y</span>
        <strong id="yValue">0</strong>
      </div>
    </section>

    <section class="mic-card">
      <h2>MIC data</h2>

      <article class="mic">
        <div class="mic-head">
          <strong>MIC1</strong>
          <span>D34</span>
        </div>
        <div class="row">
          <span>Freq</span>
          <b><span id="freq1">0</span> Hz</b>
        </div>
        <div class="bar"><i id="freqBar1"></i></div>
        <div class="row">
          <span>Vol</span>
          <b id="vol1">0</b>
        </div>
        <div class="bar"><i id="volBar1"></i></div>
      </article>

      <article class="mic">
        <div class="mic-head">
          <strong>MIC2</strong>
          <span>D35</span>
        </div>
        <div class="row">
          <span>Freq</span>
          <b><span id="freq2">0</span> Hz</b>
        </div>
        <div class="bar"><i id="freqBar2"></i></div>
        <div class="row">
          <span>Vol</span>
          <b id="vol2">0</b>
        </div>
        <div class="bar"><i id="volBar2"></i></div>
      </article>

      <article class="mic">
        <div class="mic-head">
          <strong>MIC3</strong>
          <span>VP / GPIO36</span>
        </div>
        <div class="row">
          <span>Freq</span>
          <b><span id="freq3">0</span> Hz</b>
        </div>
        <div class="bar"><i id="freqBar3"></i></div>
        <div class="row">
          <span>Vol</span>
          <b id="vol3">0</b>
        </div>
        <div class="bar"><i id="volBar3"></i></div>
      </article>
    </section>

    <section class="raw-card">
      <h2>Frame</h2>
      <pre id="raw">{}</pre>
    </section>
  </main>

  <script src="/static/mobile.js"></script>
</body>
</html>
