<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar Monitor</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#03060a;color:#e8f1ff;overflow:hidden}
header{height:54px;padding:8px 12px;background:#05070b;border-bottom:1px solid #263447;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:20px}
.status{font-size:14px;color:#8fa3bd}
main{height:calc(100vh - 54px);display:grid;grid-template-columns:1fr 260px;gap:8px;padding:8px}
.panel{background:#0b111a;border:1px solid #263447;border-radius:12px;padding:8px}
canvas{width:100%;height:100%;display:block;background:#02050a;border:1px solid #263447;border-radius:10px}
.side{display:grid;gap:8px;grid-auto-rows:min-content}
.metric{padding:10px;background:#081019;border:1px solid #263447;border-radius:8px}
.metric span{display:block;color:#8fa3bd;font-size:13px}
.metric b{display:block;font-size:28px;margin-top:4px}
.bar{height:14px;background:#071019;border:1px solid #263447;border-radius:999px;overflow:hidden;margin-top:5px}
.fill{height:100%;width:0%;background:#49d17d}
@media(max-width:900px){
  main{grid-template-columns:1fr;height:calc(100vh - 54px);overflow:auto}
  .side{grid-template-columns:1fr 1fr}
  .mapPanel{height:58vh}
}
</style>
</head>
<body>
<header>
  <h1>Монитор акустического радара</h1>
  <div class="status" id="status">ожидание данных...</div>
</header>

<main>
  <section class="panel mapPanel">
    <canvas id="map" width="1000" height="700"></canvas>
  </section>

  <aside class="side">
    <div class="metric"><span>X</span><b id="xOut">0.50</b></div>
    <div class="metric"><span>Y</span><b id="yOut">0.50</b></div>
    <div class="metric"><span>Частота</span><b id="freqOut">0 Hz</b></div>
    <div class="metric"><span>Громкость</span><b id="volOut">0%</b></div>

    <div class="metric">
      <span>MIC1 LT</span>
      <b id="mic1txt">0%</b>
      <div class="bar"><div class="fill" id="mic1bar"></div></div>
    </div>

    <div class="metric">
      <span>MIC2 RT</span>
      <b id="mic2txt">0%</b>
      <div class="bar"><div class="fill" id="mic2bar"></div></div>
    </div>

    <div class="metric">
      <span>MIC3 LB</span>
      <b id="mic3txt">0%</b>
      <div class="bar"><div class="fill" id="mic3bar"></div></div>
    </div>

    <div class="metric">
      <span>MIC4 RB</span>
      <b id="mic4txt">0%</b>
      <div class="bar"><div class="fill" id="mic4bar"></div></div>
    </div>
  </aside>
</main>

<script>
const canvas=document.getElementById('map');
const ctx=canvas.getContext('2d');

const statusEl=document.getElementById('status');
const xOut=document.getElementById('xOut');
const yOut=document.getElementById('yOut');
const freqOut=document.getElementById('freqOut');
const volOut=document.getElementById('volOut');

let lastState=null;

function draw(state){
  const w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#02050a';
  ctx.fillRect(0,0,w,h);

  ctx.strokeStyle='#1b2a3b';
  ctx.lineWidth=1;
  for(let i=0;i<=10;i++){
    const x=i*w/10,y=i*h/10;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
  }

  ctx.fillStyle='#8fa3bd';
  ctx.font='15px Arial';
  for(let i=0;i<=10;i++){
    ctx.fillText((i/10).toFixed(1),i*w/10+4,h-8);
    ctx.fillText((i/10).toFixed(1),5,i*h/10+16);
  }

  for(const mic of state.mics){
    const mx=mic.x*w,my=mic.y*h;

    ctx.beginPath();
    ctx.arc(mx,my,22+mic.level*70,0,Math.PI*2);
    ctx.fillStyle=`rgba(73,209,125,${0.10+mic.level*0.65})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(mx,my,13,0,Math.PI*2);
    ctx.fillStyle='#49d17d';
    ctx.fill();

    ctx.fillStyle='#e8f1ff';
    ctx.font='bold 20px Arial';
    ctx.fillText(mic.name,mx+22,my-10);

    ctx.fillStyle='#9fb3cc';
    ctx.font='16px Arial';
    ctx.fillText(`${Math.round(mic.level*100)}% gain ${mic.gain.toFixed(2)}`,mx+22,my+14);
  }

  const sx=state.source.x*w,sy=state.source.y*h;
  ctx.beginPath();
  ctx.arc(sx,sy,16,0,Math.PI*2);
  ctx.fillStyle='#ffcf5a';
  ctx.fill();

  ctx.fillStyle='#ffcf5a';
  ctx.font='bold 22px Arial';
  ctx.fillText('VIRTUAL SOURCE',sx+22,sy-14);

  const ex=state.estimate.x*w,ey=state.estimate.y*h;
  ctx.strokeStyle='#ff5f6d';
  ctx.lineWidth=5;

  ctx.beginPath();
  ctx.arc(ex,ey,24,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(ex-34,ey);
  ctx.lineTo(ex+34,ey);
  ctx.moveTo(ex,ey-34);
  ctx.lineTo(ex,ey+34);
  ctx.stroke();

  ctx.fillStyle='#ff5f6d';
  ctx.font='bold 24px Arial';
  ctx.fillText('SOUND POINT X/Y',ex+34,ey+8);

  ctx.fillStyle='#e8f1ff';
  ctx.font='26px Arial';
  ctx.fillText(`X=${state.estimate.x.toFixed(3)}  Y=${state.estimate.y.toFixed(3)}`,24,38);
  ctx.fillText(`Volume=${Math.round(state.audio.volume*100)}%  Frequency=${state.audio.freq} Hz`,24,76);
}

function updateUi(state){
  xOut.textContent=state.estimate.x.toFixed(2);
  yOut.textContent=state.estimate.y.toFixed(2);
  freqOut.textContent=state.audio.freq+' Hz';
  volOut.textContent=Math.round(state.audio.volume*100)+'%';

  for(const mic of state.mics){
    const pct=Math.round(mic.level*100);
    const txt=document.getElementById('mic'+mic.id+'txt');
    const bar=document.getElementById('mic'+mic.id+'bar');
    if(txt) txt.textContent=pct+'%';
    if(bar) bar.style.width=pct+'%';
  }

  const age=Date.now() - (state.updated_ms || 0);
  statusEl.textContent=age < 1000 ? 'данные идут' : 'данные устарели';
  statusEl.style.color=age < 1000 ? '#49d17d' : '#ffcf5a';
}

async function fetchState(){
  try{
    const r=await fetch('/api/state?ts='+Date.now());
    const state=await r.json();
    lastState=state;
    draw(state);
    updateUi(state);
  }catch(e){
    statusEl.textContent='нет связи с сервером';
    statusEl.style.color='#ff5f6d';
    if(lastState) draw(lastState);
  }
}

setInterval(fetchState,100);
fetchState();
</script>
</body>
</html>
