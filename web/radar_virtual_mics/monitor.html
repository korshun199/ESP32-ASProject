<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Radar Monitor</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#02050a;
  color:#e8f1ff;
}
header{
  height:32px;
  padding:5px 10px;
  background:#05070b;
  border-bottom:1px solid #263447;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
h1{margin:0;font-size:14px}
#status{font-size:11px;color:#8fa3bd}
main{height:calc(100vh - 32px);padding:5px}
canvas{
  width:100%;
  height:100%;
  display:block;
  background:#010509;
  border:1px solid #263447;
  border-radius:8px;
}
@media (orientation: portrait){
  body::before{
    content:"Поверни планшет горизонтально";
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:#03060a;
    color:#ffcf5a;
    font-size:24px;
    font-weight:bold;
  }
}
</style>
</head>
<body>
<header>
  <h1>Монитор радара</h1>
  <div id="status">ожидание...</div>
</header>
<main>
  <canvas id="map"></canvas>
</main>

<script>
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
let lastState = null;

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(640, Math.floor(rect.width*dpr));
  canvas.height = Math.max(360, Math.floor(rect.height*dpr));
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function draw(state){
  resizeCanvas();

  const w = canvas.width;
  const h = canvas.height;
  const cx = w/2;
  const cy = h/2;
  const rMax = Math.min(w,h)*0.43;

  ctx.fillStyle = '#010509';
  ctx.fillRect(0,0,w,h);

  ctx.strokeStyle = 'rgba(73,209,125,.25)';
  ctx.lineWidth = 1;

  for(let i=1;i<=4;i++){
    ctx.beginPath();
    ctx.arc(cx,cy,rMax*i/4,0,Math.PI*2);
    ctx.stroke();
  }

  for(let a=0;a<Math.PI*2;a+=Math.PI/4){
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*rMax, cy+Math.sin(a)*rMax);
    ctx.stroke();
  }

  const sweep = (performance.now()/900) % (Math.PI*2);
  ctx.strokeStyle = 'rgba(73,209,125,.65)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(sweep)*rMax, cy+Math.sin(sweep)*rMax);
  ctx.stroke();

  const obj = state.display_object || state.object || state.source || null;

  if(obj){
    const ox = cx + (obj.x-0.5)*rMax*2;
    const oy = cy + (obj.y-0.5)*rMax*2;

    ctx.beginPath();
    ctx.arc(ox,oy,13,0,Math.PI*2);
    ctx.fillStyle = '#ffcf5a';
    ctx.fill();

    ctx.strokeStyle = '#ffe89a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(ox,oy,22,0,Math.PI*2);
    ctx.stroke();

    ctx.fillStyle = '#ffcf5a';
    ctx.font = 'bold 18px Arial';
    ctx.fillText(state.target && state.target.locked ? 'ЗАХВАЧЕН' : 'ОБЪЕКТ', ox+20, oy-10);
  }else{
    ctx.fillStyle = '#8fa3bd';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('СИГНАЛА НЕТ', 24, 44);
  }

  if(state.target && state.target.locked){
    ctx.strokeStyle = '#ff5f6d';
    ctx.lineWidth = 5;

    ctx.beginPath();
    ctx.arc(cx,cy,26,0,Math.PI*2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx-48,cy);
    ctx.lineTo(cx+48,cy);
    ctx.moveTo(cx,cy-48);
    ctx.lineTo(cx,cy+48);
    ctx.stroke();

    ctx.fillStyle = '#ff5f6d';
    ctx.font = 'bold 30px Arial';
    ctx.fillText('ЦЕЛЬ', cx+56, cy+10);
  }
}

async function fetchState(){
  try{
    const r = await fetch('/api/state?ts=' + Date.now());
    const state = await r.json();
    lastState = state;
    draw(state);

    const age = Date.now() - (state.updated_ms || 0);
    statusEl.textContent = age < 1000 ? 'данные идут' : 'данные устарели';
    statusEl.style.color = age < 1000 ? '#49d17d' : '#ffcf5a';
  }catch(e){
    statusEl.textContent = 'нет связи';
    statusEl.style.color = '#ff5f6d';
    if(lastState) draw(lastState);
  }
}

setInterval(fetchState,120);
fetchState();
</script>
</body>
</html>
