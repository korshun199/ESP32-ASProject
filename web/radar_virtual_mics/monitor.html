<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Radar Monitor</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#02050a;
  color:#e8f1ff;
}
body{
  display:flex;
  flex-direction:column;
}
header{
  height:34px;
  min-height:34px;
  padding:5px 10px;
  background:#05070b;
  border-bottom:1px solid #263447;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
h1{
  margin:0;
  font-size:15px;
  line-height:1;
}
#status{
  font-size:11px;
  color:#8fa3bd;
}
main{
  flex:1;
  min-height:0;
  padding:5px;
}
canvas{
  width:100%;
  height:100%;
  display:block;
  background:#02050a;
  border:1px solid #263447;
  border-radius:8px;
}

@media (orientation: portrait){
  body::before{
    content:"Поверни планшет горизонтально";
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:24px;
    background:#03060a;
    color:#ffcf5a;
    font-size:24px;
    font-weight:bold;
  }
}
</style>
</head>
<body>
<header>
  <h1>Монитор радара</h1>
  <div id="status">ожидание...</div>
</header>

<main>
  <canvas id="map"></canvas>
</main>

<script>
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');

let lastState = null;

function resizeCanvas(){
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.max(640, Math.floor(rect.width * dpr));
  canvas.height = Math.max(360, Math.floor(rect.height * dpr));
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function draw(state){
  resizeCanvas();

  const w = canvas.width;
  const h = canvas.height;

  ctx.clearRect(0, 0, w, h);

  ctx.fillStyle = '#02050a';
  ctx.fillRect(0, 0, w, h);

  // grid
  ctx.strokeStyle = '#172538';
  ctx.lineWidth = 1;

  for(let i = 0; i <= 10; i++){
    const x = i * w / 10;
    const y = i * h / 10;

    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }

  // border
  ctx.strokeStyle = '#33475f';
  ctx.lineWidth = 2;
  ctx.strokeRect(2, 2, w - 4, h - 4);

  // microphones as small fixed points
  if(state.mics){
    for(const mic of state.mics){
      const mx = mic.x * w;
      const my = mic.y * h;

      ctx.beginPath();
      ctx.arc(mx, my, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#49d17d';
      ctx.fill();

      ctx.fillStyle = '#7f95ad';
      ctx.font = Math.max(10, Math.floor(h * 0.026)) + 'px Arial';
      ctx.fillText(mic.name.replace('MIC', 'M'), mx + 10, my - 7);
    }
  }

  // real virtual source, small yellow point
  if(state.source){
    const sx = state.source.x * w;
    const sy = state.source.y * h;

    ctx.beginPath();
    ctx.arc(sx, sy, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#ffcf5a';
    ctx.fill();

    ctx.fillStyle = '#ffcf5a';
    ctx.font = 'bold ' + Math.max(11, Math.floor(h * 0.030)) + 'px Arial';
    ctx.fillText('SRC', sx + 12, sy - 8);
  }

  // estimated sound point, main red cross
  const ex = state.estimate.x * w;
  const ey = state.estimate.y * h;

  const cross = Math.max(22, Math.floor(Math.min(w, h) * 0.045));
  const circle = Math.max(14, Math.floor(Math.min(w, h) * 0.030));

  ctx.strokeStyle = '#ff5f6d';
  ctx.lineWidth = Math.max(3, Math.floor(Math.min(w, h) * 0.006));

  ctx.beginPath();
  ctx.arc(ex, ey, circle, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(ex - cross, ey);
  ctx.lineTo(ex + cross, ey);
  ctx.moveTo(ex, ey - cross);
  ctx.lineTo(ex, ey + cross);
  ctx.stroke();

  ctx.fillStyle = '#ff5f6d';
  ctx.font = 'bold ' + Math.max(15, Math.floor(h * 0.040)) + 'px Arial';
  ctx.fillText('X/Y', ex + cross + 8, ey + 7);

  // only X/Y numbers, no extra garbage
  ctx.fillStyle = '#e8f1ff';
  ctx.font = Math.max(14, Math.floor(h * 0.040)) + 'px Arial';
  ctx.fillText(
    `X=${state.estimate.x.toFixed(3)}   Y=${state.estimate.y.toFixed(3)}`,
    18,
    34
  );
}

async function fetchState(){
  try{
    const r = await fetch('/api/state?ts=' + Date.now());
    const state = await r.json();

    lastState = state;
    draw(state);

    const age = Date.now() - (state.updated_ms || 0);

    if(age < 1000){
      statusEl.textContent = 'данные идут';
      statusEl.style.color = '#49d17d';
    }else{
      statusEl.textContent = 'данные устарели';
      statusEl.style.color = '#ffcf5a';
    }
  }catch(e){
    statusEl.textContent = 'нет связи';
    statusEl.style.color = '#ff5f6d';

    if(lastState){
      draw(lastState);
    }
  }
}

setInterval(fetchState, 120);
fetchState();
</script>
</body>
</html>
